services: 
  backend: 
    build: ./backend 
    ports: 
      - "8000:8000"
    env_file:
      - ./backend/.env.docker
    depends_on:
      - db
    
  db:
    image: postgres:15
    env_file:
      - ./backend/.env.docker
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

volumes:
  postgres_data: